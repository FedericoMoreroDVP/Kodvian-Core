<aside class="sidebar">
  <div class="brand-panel" aria-label="Identidad de marca Kodvian">
    <img class="brand-wordmark" src="/assets/branding/kodvian-wordmark.svg" alt="Kodvian solutions, soluciones informáticas" />
  </div>

  <div class="section-title">Panel operativo</div>

  <mat-nav-list>
    @for (item of items; track item.route) {
      <a mat-list-item [routerLink]="item.route" routerLinkActive="active-item" (click)="itemSelected.emit()">
        <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
        <span matListItemTitle>{{ item.label }}</span>
      </a>
    }
  </mat-nav-list>

  <div class="sidebar-footer">
    <div class="security-card">
      <mat-icon aria-hidden="true">verified_user</mat-icon>
      <span>Operación segura</span>
    </div>

    @if (user) {
      <div class="user-card" aria-label="Usuario autenticado">
        <span class="avatar">{{ userInitials }}</span>
        <span class="user-copy">
          <strong>{{ user.fullName }}</strong>
          <small>{{ user.roles.join(' · ') }}</small>
        </span>
      </div>
    }
  </div>
</aside>
