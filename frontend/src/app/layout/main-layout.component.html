<mat-sidenav-container class="layout-shell" [hasBackdrop]="true">
  <!-- El menú se abre como panel superpuesto con fondo oscuro y se oculta solo al elegir una opción,
       al hacer click afuera o con Esc; así el contenido usa siempre todo el ancho. -->
  <mat-sidenav #sidenav id="main-sidenav" mode="over" [opened]="sidenavOpened" (openedChange)="onOpenedChange($event)"
    [autoFocus]="'first-tabbable'" aria-label="Menú principal">
    <app-sidebar (itemSelected)="onSidebarItemSelected()"></app-sidebar>
  </mat-sidenav>

  <mat-sidenav-content>
    <app-header [menuExpanded]="sidenavOpened" (menuClick)="toggleSidebar()" (logoutClick)="cerrarSesion()"></app-header>
    <main class="content">
      <router-outlet></router-outlet>
    </main>
    <app-ai-quick-launcher></app-ai-quick-launcher>
  </mat-sidenav-content>
</mat-sidenav-container>
