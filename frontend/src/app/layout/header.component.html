<mat-toolbar class="app-header">
  <button mat-icon-button [attr.aria-label]="menuExpanded ? 'Cerrar menú' : 'Abrir menú'" [attr.title]="menuExpanded ? 'Cerrar menú' : 'Abrir menú'"
    aria-controls="main-sidenav" [attr.aria-expanded]="menuExpanded" (click)="menuClick.emit()">
    <mat-icon>menu</mat-icon>
  </button>

  <div class="title-block">
    <span class="title">Panel operativo</span>
    <span class="subtitle">Gestión interna de Kodvian Core</span>
  </div>

  <span class="spacer"></span>

  <button mat-icon-button aria-label="Cerrar sesión" title="Cerrar sesión" (click)="logoutClick.emit()">
    <mat-icon>logout</mat-icon>
  </button>
</mat-toolbar>
